name: bump-version

on:
  push:
    branches: [main]
    paths-ignore: ['.codex-plugin/plugin.json']

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump patch version
        run: |
          node -e 'const fs=require("fs");const f=".codex-plugin/plugin.json";const t=fs.readFileSync(f,"utf8");const n=t.replace(/"version": "(\d+)\.(\d+)\.(\d+)"/,(m,a,b,c)=>`"version": "${a}.${b}.${+c+1}"`);if(n===t)throw new Error("version not bumped");fs.writeFileSync(f,n)'

      - name: Commit and push
        run: |
          if git diff --quiet -- .codex-plugin/plugin.json; then
            echo "No version change"; exit 0
          fi
          VERSION=$(node -p "require('./.codex-plugin/plugin.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codex-plugin/plugin.json
          git commit -m "chore: bump version to $VERSION"
          git push
